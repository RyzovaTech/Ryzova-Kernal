name: Phase 5.5 Windows PE32+ structural feasibility
on:
  push:
    branches: ['phase5/**', main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-pe-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check PE32+ static analyzer negative cases
        env:
          PHASE5_CC: ${{ matrix.compiler }}
          PHASE5_SANITIZE: '1'
        run: python3 -m unittest discover -s tests -p 'test_phase5_5_pe.py' -v
      - name: Freestanding parser compilation
        env:
          CC: ${{ matrix.compiler }}
        run: |
          "$CC" -std=c11 -ffreestanding -fno-builtin -O2 -Wall -Wextra -Werror -pedantic \
            -c ryzova/compat/windows/pe64.c -o /tmp/phase55.o
