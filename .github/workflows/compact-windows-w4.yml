name: Compact Windows W4
on:
  pull_request:
    paths:
      - 'ryzova/compat/windows/**'
      - 'ryzova/compact/windows-v1-plan.json'
      - 'scripts/compact_windows_w[234]*'
      - 'tests/test_compact_windows_w[234].py'
      - 'tests/fixtures/windows_w4_reference.c'
      - 'docs/COMPACT-WINDOWS*'
      - '.github/workflows/compact-windows-w4.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  file-boundaries:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_compact_windows_w*.py' -v
      - name: Preserve legacy metadata regressions
        env:
          PHASE5_SANITIZE: '1'
        run: python -m unittest discover -s tests -p test_phase5_5_pe.py -v
  windows-reference:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Preserve source bytes and excluded Plan 9 index names
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.protectNTFS false
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/compact_windows_w4_reference.ps1
            /tests/fixtures/windows_w4_reference.c
      - name: Compile and execute file-I/O Windows reference
        shell: pwsh
        run: ./scripts/compact_windows_w4_reference.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-w4-compiler-reference
          if-no-files-found: error
          path: |
            artifacts/compact-windows/w4-reference/reference.exe
            artifacts/compact-windows/w4-reference/native-reference.json
            artifacts/compact-windows/w4-reference/build.log
  identical-pe-comparison:
    needs: [file-boundaries, windows-reference]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: windows-w4-compiler-reference
          path: artifacts/w4-reference
      - name: Compare identical PE file bytes, API calls, stdout and DWORD exit
        run: >-
          python scripts/compact_windows_w4.py
          --reference artifacts/w4-reference/reference.exe
          --receipt artifacts/w4-reference/native-reference.json
      - uses: actions/upload-artifact@v4
        with:
          name: windows-w4-hosted-comparison
          if-no-files-found: error
          path: artifacts/compact-windows/w4/comparison.json
