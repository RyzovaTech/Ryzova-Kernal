# SPDX-License-Identifier: AGPL-3.0-only
name: D5 display and audio MMIO guard regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'sys/src/9/pc/vgaigfx.c'
      - 'sys/src/9/pc/audiohda.c'
      - 'tests/test_d5_display_audio.py'
      - '.github/workflows/d5-display-audio.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  display-audio-source-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p 'test_d5_display_audio.py' -v
