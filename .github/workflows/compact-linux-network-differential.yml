name: CLX-05 IPv4 IPv6 bounded UDP TCP guest differential safety
on:
  pull_request:
    branches: [main]
    paths:
      - 'ryzova/compat/linux/syscall.h'
      - 'ryzova/compat/linux/syscall_net.h'
      - 'tests/fixtures/compact_sockets.c'
      - 'scripts/phase9_sockets.py'
      - 'tests/test_phase9_sockets.py'
      - '.github/workflows/compact-linux-network-differential.yml'
permissions:
  contents: read
jobs:
  isolated-loopback:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Host Linux vs Ryzova actual bounded socket ELF and negative tests
        run: |
          python -m unittest discover -s tests -p 'test_phase9_sockets.py' -v
