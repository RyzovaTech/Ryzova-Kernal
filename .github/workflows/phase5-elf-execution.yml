name: Phase 5.4 real Linux ELF subset interpreter PoC
on:
  push:
    branches: ['phase5/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-elf-interpreter:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Execute real static ELF through bounded virtual syscall interpreter
        env:
          PHASE5_CC: ${{ matrix.compiler }}
          PHASE5_SANITIZE: '1'
        run: python3 -m unittest discover -s tests -p 'test_phase5_4.py' -v
      - name: Compile interpreter freestanding
        env:
          CC: ${{ matrix.compiler }}
        run: |
          "$CC" -std=c11 -ffreestanding -fno-builtin -O2 -Wall -Wextra -Werror -pedantic \
            -c ryzova/compat/linux/subset_vm.c -o /tmp/phase54.o
