name: Phase 5.7 macOS Mach-O structural feasibility
on:
  push:
    branches: ['phase5/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macho-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run Mach-O security and format tests
        env:
          PHASE5_CC: ${{ matrix.compiler }}
          PHASE5_SANITIZE: '1'
        run: python3 -m unittest discover -s tests -p 'test_phase5_7_macho.py' -v
      - name: Compile Mach-O parser in freestanding mode
        env:
          CC: ${{ matrix.compiler }}
        run: |
          "$CC" -std=c11 -ffreestanding -fno-builtin -O2 -Wall -Wextra -Werror -pedantic \
            -c ryzova/compat/macos/macho64.c -o /tmp/phase57-macho.o
