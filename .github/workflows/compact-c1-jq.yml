name: Compact C1 jq baseline
on:
  pull_request:
    paths:
      - '.github/workflows/compact-c1-jq.yml'
      - 'scripts/compact_c1_*.py'
      - 'ryzova/compat/linux/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-reference-and-hosted-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 scripts/compact_c1_linux_jq.py evidence/linux-jq.json
      - uses: actions/upload-artifact@v4
        with:
          name: compact-c1-linux-jq
          path: evidence/linux-jq.json
          if-no-files-found: error
      - name: Collect pinned fixture for opcode diagnosis
        run: |
          curl -fsSL --max-time 60 https://github.com/jqlang/jq/releases/download/jq-1.8.1/jq-linux-amd64 -o evidence/jq-linux-amd64
          echo '020468de7539ce70ef1bceaf7cde2e8c4f2ca6c3afb84642aabc5c97d9fc2a0d  evidence/jq-linux-amd64' | sha256sum -c
          objdump -d --start-address=0x403a60 --stop-address=0x403a90 evidence/jq-linux-amd64
      - uses: actions/upload-artifact@v4
        with:
          name: compact-c1-linux-debug-fixture
          path: evidence/jq-linux-amd64
          if-no-files-found: error
          retention-days: 1
