name: Phase 5.8 cross-platform compatibility acceptance inventory
on:
  push:
    branches: ['phase5/**', main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration-inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Ensure unsupported application claims and merging are blocked
        run: python3 -m unittest discover -s tests -p 'test_phase5_8_matrix.py' -v
      - name: Verify Linux/Windows/macOS scoped source contracts
        run: python3 scripts/phase5_matrix.py
      - name: Archive non-binary evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-cross-platform-inventory
          path: artifacts/phase5/cross-platform-status.json
          if-no-files-found: warn
