name: Ryzova source foundation checks

on:
  push:
    branches: [main, 'integration/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out full source history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify source layout and licenses
        shell: bash
        run: bash scripts/verify-foundation.sh
