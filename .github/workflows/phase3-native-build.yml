name: Phase 3 AMD64 native source build (experimental)

on:
  push:
    branches: [main, 'phase7/**']
    paths:
      - 'sys/src/9/**'
      - 'sys/include/**'
      - 'amd64/include/**'
      - 'arm64/include/**'
      - 'ryzova/**'
      - 'scripts/phase3-native-build.py'
      - 'scripts/m5_arm64_qemu_probe.py'
      - 'scripts/m2_qemu_probe.py'
      - 'scripts/phase4_1_stability.py'
      - 'scripts/phase4_5_stress.py'
      - 'scripts/phase6_native_9p.py'
      - 'scripts/phase7_handoff.py'
      - 'scripts/phase7_secure_closeout.py'
      - 'scripts/phase7_native_guest_tls.py'
      - 'scripts/extract-9pc64.py'
      - 'scripts/check-identity.py'
      - 'scripts/verify-foundation.sh'
      - '.github/workflows/phase3-native-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'sys/src/9/**'
      - 'sys/include/**'
      - 'amd64/include/**'
      - 'arm64/include/**'
      - 'ryzova/**'
      - 'scripts/phase3-native-build.py'
      - 'scripts/m5_arm64_qemu_probe.py'
      - 'scripts/m2_qemu_probe.py'
      - 'scripts/phase4_1_stability.py'
      - 'scripts/phase4_5_stress.py'
      - 'scripts/phase6_native_9p.py'
      - 'scripts/phase7_handoff.py'
      - 'scripts/phase7_secure_closeout.py'
      - 'scripts/phase7_native_guest_tls.py'
      - 'scripts/extract-9pc64.py'
      - 'scripts/check-identity.py'
      - 'scripts/verify-foundation.sh'
      - '.github/workflows/phase3-native-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install isolated QEMU dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-system-arm qemu-utils file mtools
      - name: Verify upstream source provenance
        run: bash scripts/verify-foundation.sh
      - name: Fetch and verify 9front native build guest image
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --max-time 900 \
            https://build.9front.org/release/9front-11952.amd64.qcow2.gz -o 9front.qcow2.gz
          echo '3c1b57c4b609525e76cb0abac48bc657f71187fd3506674dba4e49b42141729c  9front.qcow2.gz' | sha256sum -c -
          gzip -dc 9front.qcow2.gz > 9front.qcow2
          qemu-img create -f qcow2 -F qcow2 -b 9front.qcow2 native-build-overlay.qcow2
      - name: Transfer exact Git checkout kernel source and run Plan 9 mk
        run: python3 scripts/phase3-native-build.py native-build-overlay.qcow2
      - name: Probe actual ARM64 QEMU virt boot if native ARM64 uImage linked
        run: python3 scripts/m5_arm64_qemu_probe.py native-build-overlay.qcow2
      - name: Evaluate M5 native ARM64 cross-build vs operational gates
        if: always()
        run: python3 scripts/m5_server_gates.py --cross-report artifacts/phase3/m5-arm64-native-build.json --arm64-serial artifacts/phase3/m5-arm64-boot-serial.log --output artifacts/phase3/m5-full-gates.json
      - name: Independently verify compiled kernel SHA256 from FAT boot disk (no public binary)
        if: always()
        run: python3 scripts/extract-9pc64.py native-build-overlay.qcow2
      - name: Verify Phase 7 native QEMU evidence chain and readiness (research only)
        run: python3 scripts/phase7_handoff.py
      - name: Verify Phase 7 secure-gateway native QEMU bridge and research-only closeout
        run: python3 scripts/phase7_secure_closeout.py
      - name: Remove huge disk images before logs upload
        if: always()
        run: rm -f 9front.qcow2.gz 9front.qcow2 native-build-overlay.qcow2
      - name: Archive native guest source/build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase3-native-build-evidence
          path: |
            artifacts/phase3/serial.log
            artifacts/phase3/host.log
            artifacts/phase3/fresh-boot-serial.log
            artifacts/phase3/fresh-kernel-qemu-host.log
            artifacts/phase3/m2-chipset-probe-serial.log
            artifacts/phase3/m2-qemu-host.log
            artifacts/phase3/result.txt
            artifacts/phase3/m5-arm64-native-build.json
            artifacts/phase3/m5-arm64-qemu-probe.json
            artifacts/phase3/m5-arm64-boot-serial.log
            artifacts/phase3/m5-full-gates.json
            artifacts/phase3/source-provenance.txt
            artifacts/phase3/9pc64.sha256
            artifacts/phase3/kernel-provenance.json
            artifacts/phase3/phase4-1-stability.json
            artifacts/phase3/phase4-5-stress.json
            artifacts/phase3/phase6-native-9p.json
            artifacts/phase3/phase7-entry.json
            artifacts/phase3/phase7-secure-bridge.json
            artifacts/phase3/phase7-native-guest-tls.json
            artifacts/phase3/phase7-secure-closeout.json
            artifacts/phase3/screen.ppm
          if-no-files-found: warn
          retention-days: 14
