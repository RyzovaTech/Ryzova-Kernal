name: CLX-04 read-only ELF instruction discovery safety
on:
  pull_request:
    branches:
      - main
      - feature/compact-linux-phase3-target-profiles
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate-rip:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify bounded ELF sample provenance and no fake guest completion
        run: |
          python -m unittest discover -s tests -p 'test_compact_linux_isa_discovery.py' -v
          python -m py_compile scripts/compact_linux_isa_discovery.py
