name: Phase 9.2 Compact native adapter regressions
on:
  pull_request:
    branches: [main, 'feature/phase9-1-compact-contract-v1']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compact-subset:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Interpreter reference and evidence rejection regressions
        run: python -m unittest discover -s tests -p 'test_phase9_compact_native.py' -v
      - name: Existing Phase 5 baseline
        run: python -m unittest discover -s tests -p 'test_phase5*.py' -v
