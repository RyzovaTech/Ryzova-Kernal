name: Compact Linux locked target build and resource discovery
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/compact_linux_targets.py'
      - 'scripts/compact_linux_isa_discovery.py'
      - 'tests/test_compact_linux_isa_discovery.py'
      - 'scripts/compact_linux_target_profiles.py'
      - 'ryzova/compact/linux-target-sources.json'
      - 'ryzova/compact/linux-v1-plan.json'
      - 'ryzova/compat/linux/**'
      - 'tests/test_compact_linux_targets.py'
      - 'scripts/compact_linux_binary_locks.py'
      - 'tests/test_compact_linux_binary_locks.py'
      - 'docs/validation/compact-linux-v1-binary-locks.json'
      - 'tests/test_phase9_image_admission.py'
      - 'tests/fixtures/compact_git_config_probes.c'
      - '.github/workflows/compact-linux-target-profiles.yml'
  workflow_dispatch:
concurrency:
  group: compact-target-profiles-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  target-profiles:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: richfelker/musl-cross-make
          ref: 5e8042e63de29f8473fc3b0b831a587ba284e1a8
          path: artifacts/build-driver
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        id: cache-sources
        with:
          path: artifacts/targets/sources
          key: compact-linux-sources-v1-${{ hashFiles('ryzova/compact/linux-target-sources.json') }}
      - uses: actions/cache/restore@v4
        id: cache-cross
        with:
          path: artifacts/targets/cross
          key: compact-linux-cross-v1-${{ hashFiles('ryzova/compact/linux-target-sources.json') }}
      - uses: actions/cache/restore@v4
        id: cache-native
        with:
          path: artifacts/targets/native-toolchain
          key: compact-linux-native-v1-${{ hashFiles('ryzova/compact/linux-target-sources.json') }}
      - name: Install bounded build and measurement prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential bison flex texinfo lzip rsync strace time pkg-config
      - name: Validate source lock and build selected target releases for musl
        run: |
          python scripts/compact_linux_targets.py --check-lock
          python -m unittest discover -s tests -p test_compact_linux_targets.py -v
          python scripts/compact_linux_targets.py --output artifacts/targets --driver artifacts/build-driver --jobs 4 --stage sources
      - name: Build or verify pinned bootstrap cross compiler
        run: python scripts/compact_linux_targets.py --output artifacts/targets --driver artifacts/build-driver --jobs 4 --stage cross
      - name: Build or verify native musl GCC and binutils
        run: python scripts/compact_linux_targets.py --output artifacts/targets --driver artifacts/build-driver --jobs 4 --stage native
      - name: Build named applications and dependency closure
        run: python scripts/compact_linux_targets.py --output artifacts/targets --driver artifacts/build-driver --jobs 4 --stage apps
      - name: Discover actual resource use and guest admission blockers
        run: python scripts/compact_linux_target_profiles.py --directory artifacts/targets --output artifacts/targets/target-profiles.json
      - name: Verify immutable source and seven release ELF hash locks
        run: |
          python -m unittest discover -s tests -p test_compact_linux_binary_locks.py -v
          python scripts/compact_linux_binary_locks.py --root . --profiles artifacts/targets/target-profiles.json
      - name: Attribute candidate failing instruction bytes without changing acceptance
        if: always()
        run: |
          if test -f artifacts/targets/target-profiles.json; then
            python scripts/compact_linux_isa_discovery.py \
              --root artifacts/targets/root \
              --profiles artifacts/targets/target-profiles.json \
              --output artifacts/targets/target-isa-candidates.json
          fi
      - uses: actions/cache/save@v4
        if: always() && steps.cache-sources.outputs.cache-hit != 'true' && hashFiles('artifacts/targets/sources/gcc-14.2.0.tar.xz') != ''
        with:
          path: artifacts/targets/sources
          key: compact-linux-sources-v1-${{ hashFiles('ryzova/compact/linux-target-sources.json') }}
      - uses: actions/cache/save@v4
        if: always() && steps.cache-cross.outputs.cache-hit != 'true' && hashFiles('artifacts/targets/cross/toolchain-stage.json') != ''
        with:
          path: artifacts/targets/cross
          key: compact-linux-cross-v1-${{ hashFiles('ryzova/compact/linux-target-sources.json') }}
      - uses: actions/cache/save@v4
        if: always() && steps.cache-native.outputs.cache-hit != 'true' && hashFiles('artifacts/targets/native-toolchain/toolchain-stage.json') != ''
        with:
          path: artifacts/targets/native-toolchain
          key: compact-linux-native-v1-${{ hashFiles('ryzova/compact/linux-target-sources.json') }}
      - name: Preserve source locks, build logs and honest qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compact-linux-target-profiles
          path: |
            ryzova/compact/linux-target-sources.json
            artifacts/targets/logs/*
            artifacts/targets/target-build.json
            artifacts/targets/target-profiles.json
            artifacts/targets/target-isa-candidates.json
          if-no-files-found: error
          retention-days: 30
