name: Compact macOS M2 through M6 execution proof
on:
  pull_request:
    paths:
      - 'ryzova/compat/macos/**'
      - 'tests/fixtures/macos_m1_reference.macho'
      - 'tests/test_compact_macos_m2.py'
      - 'tests/fixtures/macos_m3_guest.S'
      - 'tests/fixtures/macos_m4_reference.S'
      - 'tests/fixtures/macos_m5_reference.S'
      - 'tests/fixtures/macos_m6_reference.S'
      - 'scripts/compact_macos_m3_fixture.py'
      - 'scripts/compact_macos_m2_native.py'
      - 'scripts/compact_macos_m6_check.py'
      - '.github/workflows/compact-macos-m2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -p test_compact_macos_m2.py -v
  macos-dynamic-reference:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tests/fixtures
      - name: Build and run the dynamic PIE reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(uname -m)" = x86_64
          clang -arch x86_64 -Wl,-fixup_chains tests/fixtures/macos_m4_reference.S -o evidence/m4
          test "$(lipo -archs evidence/m4)" = x86_64
          status=0
          ./evidence/m4 > evidence/stdout.txt 2> evidence/stderr.txt || status=$?
          test "$status" -eq 47
          test ! -s evidence/stderr.txt
          printf 'FLEX_MACOS_M4_DYNAMIC\n' | cmp - evidence/stdout.txt
          printf '%s\n' "$status" > evidence/exit.txt
          git rev-parse HEAD > evidence/commit.txt
          shasum -a 256 evidence/m4 > evidence/sha256.txt
          otool -l evidence/m4 > evidence/load-commands.txt
      - uses: actions/upload-artifact@v4
        with:
          name: compact-macos-m4-reference
          path: evidence/
          if-no-files-found: error
  macos-arm64-reference:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tests/fixtures
      - name: Build and run the Apple Silicon PIE reference
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(uname -m)" = arm64
          clang -arch arm64 -Wl,-fixup_chains tests/fixtures/macos_m5_reference.S -o evidence/m5
          test "$(lipo -archs evidence/m5)" = arm64
          status=0
          ./evidence/m5 > evidence/stdout.txt 2> evidence/stderr.txt || status=$?
          test "$status" -eq 53
          test ! -s evidence/stderr.txt
          printf 'FLEX_MACOS_M5_ARM64!\n' | cmp - evidence/stdout.txt
          printf '%s\n' "$status" > evidence/exit.txt
          git rev-parse HEAD > evidence/commit.txt
          shasum -a 256 evidence/m5 > evidence/sha256.txt
          otool -l evidence/m5 > evidence/load-commands.txt
          sw_vers > evidence/platform.txt
      - uses: actions/upload-artifact@v4
        with:
          name: compact-macos-m5-reference
          path: evidence/
          if-no-files-found: error
  macos-file-reference:
    strategy:
      matrix:
        include:
          - {arch: x86_64, runner: macos-15-intel}
          - {arch: arm64, runner: macos-15}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            tests/fixtures
      - name: Build and verify scoped file workload
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          test "$(uname -m)" = "$ARCH"
          mkdir -p evidence
          clang -arch "$ARCH" -Wl,-fixup_chains tests/fixtures/macos_m6_reference.S -o evidence/m6
          test "$(lipo -archs evidence/m6)" = "$ARCH"
          printf 'IN!\n' > evidence/entry.txt
          status=0
          (cd evidence && env -i FLEX_NOTE=demo ./m6 entry.txt > stdout.txt 2> stderr.txt) || status=$?
          test "$status" -eq 61
          test ! -s evidence/stderr.txt
          printf 'IN!\n' | cmp - evidence/stdout.txt
          printf 'IN!\nFLEX_NOTE=demo' | cmp - evidence/entry.txt
          printf '%s\n' "$status" > evidence/exit.txt
          git rev-parse HEAD > evidence/commit.txt
          shasum -a 256 evidence/m6 > evidence/sha256.txt
          sw_vers > evidence/platform.txt
          otool -l evidence/m6 > evidence/load-commands.txt
      - uses: actions/upload-artifact@v4
        with:
          name: compact-macos-m6-${{ matrix.arch }}
          path: evidence/
          if-no-files-found: error
  native:
    runs-on: ubuntu-24.04
    needs: [reference, macos-dynamic-reference, macos-arm64-reference, macos-file-reference]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: compact-macos-m4-reference
          path: artifacts/m4-reference
      - uses: actions/download-artifact@v4
        with:
          name: compact-macos-m5-reference
          path: artifacts/m5-reference
      - uses: actions/download-artifact@v4
        with:
          pattern: compact-macos-m6-*
          path: artifacts/m6-reference
      - run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=undefined -fno-sanitize-recover=all \
            ryzova/compat/macos/{m2,grant,dynamic,arm64,workload}.c -lcrypto -o /tmp/mac-runner
          python3 scripts/compact_macos_m6_check.py /tmp/mac-runner artifacts/m6-reference
      - run: MAC_M5_REFERENCE=artifacts/m5-reference/m5 python3 -m unittest discover -s tests -p test_compact_macos_m2.py -v
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils mtools
      - run: |
          bash scripts/verify-foundation.sh
          curl --fail --location --retry 3 --max-time 600 https://build.9front.org/release/9front-11952.amd64.qcow2.gz -o bootstrap.qcow2.gz
          echo '3c1b57c4b609525e76cb0abac48bc657f71187fd3506674dba4e49b42141729c  bootstrap.qcow2.gz' | sha256sum -c -
          gzip -dc bootstrap.qcow2.gz > bootstrap.qcow2
          qemu-img create -f qcow2 -F qcow2 -b bootstrap.qcow2 mac-m2.qcow2
      - run: python3 scripts/compact_macos_m2_native.py mac-m2.qcow2 bootstrap.qcow2.gz --m3 artifacts/m4-reference artifacts/m5-reference artifacts/m6-reference
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compact-macos-m2-native-evidence
          path: |
            artifacts/compact-macos-m2/*.json
            artifacts/compact-macos-m2/*.log
