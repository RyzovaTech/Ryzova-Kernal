name: Compact macOS M8 upstream jq admission audit
on:
  pull_request:
    paths:
      - 'ryzova/compat/macos/**'
      - 'scripts/compact_macos_m8_jq.py'
      - 'scripts/compact_macos_m8_loader_check.py'
      - '.github/workflows/compact-macos-m8.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read

jobs:
  macos-reference:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: x86_64, runner: macos-15-intel}
          - {arch: arm64, runner: macos-15}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Pin and run upstream jq
        env:
          ARCH: ${{ matrix.arch }}
        run: python3 scripts/compact_macos_m8_jq.py reference "$ARCH" evidence
      - uses: actions/upload-artifact@v4
        with:
          name: macos-m8-jq-${{ matrix.arch }}
          path: evidence/
          if-no-files-found: error
  admission-audit:
    needs: macos-reference
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-m8-jq-*
          path: references
      - name: Measure M6 admission against both pinned Mach-O files
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=undefined -fno-sanitize-recover=all \
            ryzova/compat/macos/{m2,grant,dynamic,arm64,workload}.c -lcrypto -o /tmp/mac-m6
          cat <<'C' | cc -std=c11 -Wall -Wextra -Werror -I ryzova/compat/macos -x c - -o /tmp/mac-m6-limits
          #include <stdio.h>
          #include "dynamic.h"
          int main(void) { return printf("%d %d\n", 3*MacPage, MacImageLimit) < 0; }
          C
          read -r intel_limit arm_limit < <(/tmp/mac-m6-limits)
          python3 scripts/compact_macos_m8_jq.py audit references /tmp/mac-m6 evidence "$intel_limit" "$arm_limit"
      - name: Verify mapped segments and chained fixups for both binaries
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -O2 -fPIC -shared \
            -fsanitize=undefined -fno-sanitize-recover=all \
            ryzova/compat/macos/m8_image.c -o /tmp/mac-m8-loader.so
          python3 scripts/compact_macos_m8_loader_check.py /tmp/mac-m8-loader.so references evidence/loader.json
      - uses: actions/upload-artifact@v4
        with:
          name: macos-m8-admission-audit
          path: evidence/
          if-no-files-found: error
