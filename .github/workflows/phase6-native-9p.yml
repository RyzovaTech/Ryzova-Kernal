name: Phase 6 native guest TCP 9P protocol and evidence tests
on:
  push:
    branches: ['phase6/native-9p-qemu-integration']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-9p-protocol-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11','3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run real-socket 9P read-only service and serial anti-forgery tests
        run: |
          python3 -m unittest discover -s tests -p 'test_phase6_native*.py' -v
          python3 -m unittest discover -s tests -p 'test_phase6_1_p9.py' -v
      - name: Python compile checks
        run: python3 -m py_compile ryzova/remote/native9p.py scripts/phase6_native_9p.py
