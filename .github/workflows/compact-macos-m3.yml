name: Compact macOS MAC-3A/B/C Restricted Linking
on:
  push:
    branches:
      - 'feature/compact-macos-*'
    paths:
      - 'ryzova/compat/macos/**'
      - 'tests/test_compact_macos_m3.py'
      - 'tests/test_compact_macos_m3_symbols.py'
      - 'tests/test_compact_macos_m3_link.py'
      - 'scripts/compact_macos_m3_demo.py'
      - 'scripts/compact_macos_m3_link_demo.py'
      - 'docs/COMPACT-MACOS-M3.md'
      - '.github/workflows/compact-macos-m3.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ryzova/compat/macos/**'
      - 'tests/test_compact_macos_m3.py'
      - 'tests/test_compact_macos_m3_symbols.py'
      - 'tests/test_compact_macos_m3_link.py'
      - 'scripts/compact_macos_m3_demo.py'
      - 'scripts/compact_macos_m3_link_demo.py'
      - 'docs/COMPACT-MACOS-M3.md'
      - '.github/workflows/compact-macos-m3.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  mac3a-macos-host-metadata:
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Clang UBSan original Mach-O metadata inventory and negative tests
        env:
          PHASE5_CC: clang
          PHASE5_SANITIZE: '1'
        run: |
          python3 -m unittest discover -s tests -p 'test_compact_macos_m3.py' -v
          python3 -m unittest discover -s tests -p 'test_compact_macos_m3_symbols.py' -v
          python3 -m unittest discover -s tests -p 'test_compact_macos_m3_link.py' -v
          python3 -m unittest discover -s tests -p 'test_compact_macos_m2.py' -v
          python3 scripts/compact_macos_m3_link_demo.py
          clang -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            ryzova/compat/macos/macho_link_meta.c \
            ryzova/compat/macos/macho_link_meta_probe.c \
            -o /tmp/ryz-mac3-meta
          clang -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            ryzova/compat/macos/macho_symbol_meta.c \
            ryzova/compat/macos/macho_symbol_meta_probe.c \
            -o /tmp/ryz-mac3-symbols
          clang -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            ryzova/compat/macos/macho64.c \
            ryzova/compat/macos/macho_vm.c \
            ryzova/compat/macos/macho_static_link.c \
            ryzova/compat/macos/macho_static_link_probe.c \
            -o /tmp/ryz-mac3-link
      - name: Reproducible source-built Darwin symbol/import metadata proof
        run: |
          mkdir -p artifacts/mac3
          python3 scripts/compact_macos_m3_demo.py | tee artifacts/mac3/m3-evidence.json
          python3 scripts/compact_macos_m3_link_demo.py | tee artifacts/mac3/m3-link-evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac3a-macos-source-provenance
          path: |
            artifacts/mac3/m3-evidence.json
            artifacts/mac3/m3-link-evidence.json
          if-no-files-found: ignore
          retention-days: 14
  mac3a-linux-host-metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: GCC and Clang sanitizer metadata parity and fail-closed tests
        env:
          PHASE5_CC: ${{ matrix.compiler }}
          PHASE5_SANITIZE: '1'
        run: |
          python3 -m unittest discover -s tests -p 'test_compact_macos_m3.py' -v
          python3 -m unittest discover -s tests -p 'test_compact_macos_m3_symbols.py' -v
          python3 -m unittest discover -s tests -p 'test_compact_macos_m3_link.py' -v
          python3 -m unittest discover -s tests -p 'test_compact_macos_m2.py' -v
