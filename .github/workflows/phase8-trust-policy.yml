name: Phase 8.0 host trust policy security regression
on:
  push:
    branches: ['phase8/**']
    paths:
      - 'ryzova/remote/phase8_trust.py'
      - 'tests/test_phase8_trust.py'
      - '.github/workflows/phase8-trust-policy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ryzova/remote/phase8_trust.py'
      - 'tests/test_phase8_trust.py'
      - '.github/workflows/phase8-trust-policy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-research-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Deny untrusted identities, revoked/expired policy and oversized scopes
        run: python3 -m unittest discover -s tests -p 'test_phase8_trust.py' -v
      - name: Compile Phase 8.0 host research modules
        run: python3 -m py_compile ryzova/remote/phase8_trust.py tests/test_phase8_trust.py
