name: Phase 9.9 Linux signals and dynamic application runtime
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build checksum-pinned unmodified musl fixtures
        run: python scripts/phase9_compiler.py --build artifacts/musl-fixtures
      - name: Fetch pinned unmodified BusyBox
        run: |
          python scripts/phase9_shell.py --fetch artifacts/jobs-fixtures
          python scripts/phase9_busybox.py --fetch artifacts/jobs-fixtures
      - name: Full portable execution, signal frames, timers and dynamic linker tests
        env:
          COMPACT_MUSL_DIR: artifacts/musl-fixtures
          COMPACT_SHELL_DIR: artifacts/jobs-fixtures
          COMPACT_BUSYBOX_DIR: artifacts/jobs-fixtures
        run: python -m unittest discover -s tests -p 'test_phase9*.py' -v
