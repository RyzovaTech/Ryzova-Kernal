name: Phase 9.9 Linux signals and dynamic application runtime
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test pinned source integrity and offline behavior
        run: python -m unittest discover -s tests -p 'test_pinned_source.py' -v
      - name: Restore verified musl and TinyCC source cache
        id: pinned-source-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            artifacts/musl-fixtures/musl-1.2.6.tar.gz
            artifacts/musl-fixtures/tcc-0.9.27.tar.bz2
          key: ryzova-phase9-pinned-musl-d585fd3b613c66151fc3249e8ed44f77020cb5e6c1e635a616d3f9f82460512a-tcc-de23af78fca90ce32dff2dd45b3432b2334740bb9bb7b05bf60fdbfc396ceb9c
      - name: Prefetch SHA256-verified musl and TinyCC archives
        run: python scripts/phase9_compiler.py --prefetch artifacts/musl-fixtures
      - name: Save validated source archives for the next CI run
        if: steps.pinned-source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            artifacts/musl-fixtures/musl-1.2.6.tar.gz
            artifacts/musl-fixtures/tcc-0.9.27.tar.bz2
          key: ryzova-phase9-pinned-musl-d585fd3b613c66151fc3249e8ed44f77020cb5e6c1e635a616d3f9f82460512a-tcc-de23af78fca90ce32dff2dd45b3432b2334740bb9bb7b05bf60fdbfc396ceb9c
      - name: Build checksum-pinned unmodified musl fixtures
        run: python scripts/phase9_compiler.py --build artifacts/musl-fixtures
      - name: Fetch pinned unmodified BusyBox
        run: |
          python scripts/phase9_shell.py --fetch artifacts/jobs-fixtures
          python scripts/phase9_busybox.py --fetch artifacts/jobs-fixtures
      - name: Validate Compact Linux V1 scope and baseline qualification guards
        run: |
          python scripts/compact_linux_baseline.py --check-plan
          python -m unittest discover -s tests -p 'test_compact_linux_plan.py' -v
      - name: Record complete Phase 5 and Phase 9 regression baseline
        env:
          COMPACT_MUSL_DIR: artifacts/musl-fixtures
          COMPACT_SHELL_DIR: artifacts/jobs-fixtures
          COMPACT_BUSYBOX_DIR: artifacts/jobs-fixtures
        run: python scripts/compact_linux_baseline.py --output artifacts/compact-linux-v1/baseline.json
      - name: Archive Compact Linux baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compact-linux-v1-baseline
          path: artifacts/compact-linux-v1/*.json
          if-no-files-found: warn
          retention-days: 30
