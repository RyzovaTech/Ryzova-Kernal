# SPDX-License-Identifier: AGPL-3.0-only
name: M6 ARM64 Runtime Evidence Boundaries

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/m6_runtime_evidence.py'
      - 'tests/test_m6_runtime_evidence.py'
      - 'docs/drivers/M6-RUNTIME-EVIDENCE-GATES.md'
      - '.github/workflows/m6-runtime-evidence.yml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-evidence-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile evidence reader and test negative gates (not a guest runtime test)
        run: |
          python3 -m py_compile scripts/m6_runtime_evidence.py
          python3 -m unittest discover -s tests -p 'test_m6_runtime_evidence.py' -v
      - name: Write current-head fail-closed evidence report
        run: |
          python3 scripts/m6_runtime_evidence.py \
            --expected-head "$(git rev-parse HEAD)" \
            --output artifacts/m6/runtime-evidence.json
          python3 - <<'PY'
          import json
          with open("artifacts/m6/runtime-evidence.json", encoding="utf-8") as f:
              gate=json.load(f)
          assert not any(gate["checks"].values())
          assert not gate["hardware_release_ready"]
          assert not gate["all_runtime_observations_consistent"]
          assert gate["newly_certified_physical_models"] == 0
          assert "independent-runtime-attestation-required" in gate["blockers"]
          PY
      - name: Strict M6 runtime request must be denied without actual ARM64 guest proof
        run: |
          if python3 scripts/m6_runtime_evidence.py \
            --expected-head "$(git rev-parse HEAD)" \
            --enforce-runtime --output artifacts/m6/strict-runtime-evidence.json; then
            echo 'ERROR: missing native ARM64 runtime evidence was accepted' >&2
            exit 1
          else
            echo 'PASS: runtime readiness remains blocked pending actual guest proof'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: m6-fail-closed-runtime-evidence
          path: |
            artifacts/m6/runtime-evidence.json
            artifacts/m6/strict-runtime-evidence.json
          if-no-files-found: error
          retention-days: 14
